# =============================================================================
# CI/CD Pipeline for Shopify Sync Microservice
# =============================================================================
# Triggers: Push to main/develop branches and pull requests
# Environments: Staging (auto) + Production (manual approval)
# Deployment: Google Cloud Run (Serverless)
# =============================================================================

name: Deploy Shopify Sync Service

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  SERVICE_NAME: shopify-sync
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  IMAGE_NAME: gcr.io/${{ vars.GCP_PROJECT_ID }}/shopify-sync

jobs:
  # =============================================================================
  # Job 1: Lint and Test
  # =============================================================================
  test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov flake8 black

      - name: Lint with flake8
        run: |
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check code formatting with black
        run: black --check app
        continue-on-error: true

      - name: Run tests
        run: |
          pytest tests/ -v --cov=app --cov-report=term-missing || echo "No tests found yet"
        continue-on-error: true

  # =============================================================================
  # Job 2: Build and Push Docker Image
  # =============================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

  # =============================================================================
  # Job 3: Deploy to Staging
  # =============================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: |
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run (Staging)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}-staging
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: |
            --port=8000
            --cpu=1
            --memory=512Mi
            --min-instances=0
            --max-instances=10
            --timeout=300
            --allow-unauthenticated
            --set-env-vars=ENVIRONMENT=staging,DEBUG=false,LOG_LEVEL=INFO,SHOPIFY_SCOPES=${{ vars.SHOPIFY_SCOPES }},SHOPIFY_API_VERSION=${{ vars.SHOPIFY_API_VERSION }},ENABLE_SCHEDULER=true,RECONCILIATION_HOUR=${{ vars.RECONCILIATION_HOUR }},RECONCILIATION_MINUTE=${{ vars.RECONCILIATION_MINUTE }},GCP_PROJECT_ID=${{ env.PROJECT_ID }},GCP_REGION=${{ env.REGION }},ENABLE_EMBEDDINGS=true
            --set-secrets=DB_DSN=DB_DSN:latest,ENCRYPTION_KEY=ENCRYPTION_KEY:latest,API_KEY=API_KEY:latest,SHOPIFY_API_KEY=SHOPIFY_API_KEY:latest,SHOPIFY_API_SECRET=SHOPIFY_API_SECRET:latest,OAUTH_REDIRECT_URL=OAUTH_REDIRECT_URL:latest,APP_URL=APP_URL:latest

      - name: Verify deployment
        run: |
          echo "Staging URL: ${{ steps.deploy.outputs.url }}"
          sleep 10
          curl -f "${{ steps.deploy.outputs.url }}/health" || curl -f "${{ steps.deploy.outputs.url }}/" || echo "Health check endpoint not available"

  # =============================================================================
  # Job 4: Deploy to Production (Manual Approval Required)
  # =============================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, deploy-staging]
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run (Production)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: |
            --port=8000
            --cpu=2
            --memory=1Gi
            --min-instances=1
            --max-instances=100
            --timeout=300
            --concurrency=80
            --allow-unauthenticated
            --set-env-vars=ENVIRONMENT=production,DEBUG=false,LOG_LEVEL=WARNING,SHOPIFY_SCOPES=${{ vars.SHOPIFY_SCOPES }},SHOPIFY_API_VERSION=${{ vars.SHOPIFY_API_VERSION }},ENABLE_SCHEDULER=true,RECONCILIATION_HOUR=${{ vars.RECONCILIATION_HOUR }},RECONCILIATION_MINUTE=${{ vars.RECONCILIATION_MINUTE }},GCP_PROJECT_ID=${{ env.PROJECT_ID }},GCP_REGION=${{ env.REGION }},ENABLE_EMBEDDINGS=true
            --set-secrets=DB_DSN=DB_DSN_PROD:latest,ENCRYPTION_KEY=ENCRYPTION_KEY:latest,API_KEY=API_KEY_PROD:latest,SHOPIFY_API_KEY=SHOPIFY_API_KEY_PROD:latest,SHOPIFY_API_SECRET=SHOPIFY_API_SECRET_PROD:latest,OAUTH_REDIRECT_URL=OAUTH_REDIRECT_URL_PROD:latest,APP_URL=APP_URL_PROD:latest

      - name: Verify deployment
        run: |
          echo "Production URL: ${{ steps.deploy.outputs.url }}"
          sleep 10
          curl -f "${{ steps.deploy.outputs.url }}/health" || curl -f "${{ steps.deploy.outputs.url }}/" || echo "Health check endpoint not available"

  # =============================================================================
  # Job 5: Notify on Deployment Status
  # =============================================================================
  notify:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()

    steps:
      - name: Deployment Status Summary
        run: |
          echo "=========================================="
          echo "DEPLOYMENT SUMMARY - SHOPIFY SYNC"
          echo "=========================================="
          echo "Staging: ${{ needs.deploy-staging.result }}"
          echo "Production: ${{ needs.deploy-production.result }}"
          echo "=========================================="
