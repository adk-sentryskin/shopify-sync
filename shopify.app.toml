# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "4070469388d97b149a6be2a88a05a98c"
name = "ChekOut AI"
application_url = "https://shopify-sync-579388332064.us-central1.run.app/"
embedded = false

[webhooks]
api_version = "2025-10"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "https://shopify-sync-579388332064.us-central1.run.app/api/webhooks/compliance"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# Required scopes: read-only, no protected customer data, no Shopify review needed.
scopes = "read_inventory,read_product_listings,read_products,read_price_rules,read_discounts,read_gift_cards,read_legal_policies,read_shipping,read_content"
# Optional scopes: read_orders accesses protected customer data (Level 1) and
# requires a Protected Customer Data approval before any merchant can actually
# grant it. Declared here so the new app version validates Shopify accepts the
# declaration; remains dormant until the PCD request clears AND the merchant
# explicitly opts in via the dashboard CTA — until both, no grants are attempted.
optional_scopes = [ "read_orders" ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://ai-builder.chekout.ai/sync/shopify/callback", "https://app.chekout.ai/sync/shopify/callback" ]
